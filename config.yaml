# bangkok-rent-watch — tous les seuils vivent ici, jamais dans le code.

# Filtres durs
bedrooms_min: 2
bathrooms_min: 2
# Le budget se raisonne en euros : c'est la devise du locataire, pas celle du marché.
# Les loyers thaïs sont convertis via eur_thb_rate. C'est le loyer TOTAL du logement,
# pas la part par personne : 1 400 €/mois = 51 800 THB au taux du 2026-09-01, pour deux.
# Les annonces au-dessus restent collectées et stockées : les médianes par quartier doivent
# porter sur tout le segment, pas sur le seul budget, sinon elles ne comparent plus rien.
budget_max_eur: 1400

# Filtres souples (lus par le scoring, phase 2)
area_min_sqm: 60
area_ideal_sqm: 70
station_max_m: 800
deposit_max_months: 2

# Conversion
eur_thb_rate: 37.0
eur_thb_rate_updated: 2026-09-01

# Séjour visé
target_move_in: 2027-04-25
target_move_out: 2027-08-31

crawl:
  # Ajoute ton email ici : le §5 demande un User-Agent identifiable et honnête, et c'est
  # ce qui permet à une source de te contacter plutôt que de te bloquer.
  user_agent: "bangkok-rent-watch/0.1 (recherche de logement personnelle)"
  delay_min_s: 2
  delay_max_s: 5
  cache_ttl_hours: 24        # 0 pendant le dev = recrawl ; 24 = une passe par jour max
  max_retries: 3

sources:
  ddproperty:
    enabled: true
    region_code: TH10        # Bangkok
    # La requête ne pose pas de plafond de prix : le §3 veut que les annonces au-dessus de
    # budget_max_eur soient stockées pour l'historique. Filtrer ici fausserait les médianes
    # par district du §8, qui doivent porter sur tout le segment et pas sur le seul budget.
    # Verifie le 2026-09-04 : la page 400 rend encore 20 annonces, toutes distinctes et
    # absentes a 90 % de la base. La pagination ne se tarit pas, donc ce plafond est un
    # budget de temps, pas une fin de catalogue : 250 pages ~ 15 min a 3,5 s la requete.
    max_pages: 250

  propertyhub:
    enabled: true
    # Pagination résolue le 2026-09-04 : elle passe par un segment d'URL (`/bangkok/2`),
    # pas par `?page=2` qui est ignoré. La zone `bangkok` compte 2413 pages à elle seule,
    # donc ce plafond est un budget de temps. 20 zones x 5 pages = 100 requêtes, ~6 min.
    max_pages_per_zone: 5
    zones:
      - bangkok
      - bts-asok
      - bts-phrom-phong
      - bts-thong-lo-thong-lor
      - bts-on-nut
      - bts-siam
      - bts-chong-nonsi
      - bts-saphan-taksin
      - bts-surasak
      - bts-saint-louis
      - bts-udom-suk
      - bts-bang-chak
      - mrt-huai-khwang
      - mrt-sutthisan
      - mrt-lat-phrao
      - mrt-sam-yan
      - mrt-phra-ram-9
      - mrt-hua-lamphong
      - mrt-ratchadaphisek
      - mrt-thailand-cultural-centre

  # Désactivées en phase 1 — cf. docs/phase0-faisabilite.md
  fazwaz:
    enabled: false           # HTML parsable, mais prix localisés par IP : à écrire ensuite
  renthub:
    # Activée le 2026-09-04. Pas pour le volume : c'est la seule source qui expose la durée
    # de bail (`shortContract`, paliers 1/3/6 mois) et la distance à la station en mètres.
    # Modèle immeuble et non annonce : ni chambres ni surface — cf. scrapers/renthub.py.
    enabled: true
    max_pages_per_zone: 4
    zones:
      - bts-asok
      - bts-phrom-phong
      - bts-thong-lo-thong-lor
      - bts-nana
      - bts-phloen-chit
      - bts-on-nut
      - bts-ekkamai
      - mrt-sukhumvit
      - mrt-phetchaburi
      - mrt-huai-khwang
      - mrt-lat-phrao
      - mrt-phra-ram-9
  hipflat:
    enabled: false           # Cloudflare, 403 jusque sur robots.txt — abandonnée
