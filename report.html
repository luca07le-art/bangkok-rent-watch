<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bangkok">
<title>Bangkok — locations</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --ink: #1a1a19; --muted: #6b6b66;
    --line: #e2e2dd; --accent: #b4530a; --accent-bg: #fbeee3; --on-accent: #fff;
    --down: #1f7a3d; --down-bg: #e7f4ec;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
    --sheet-shadow: 0 -8px 32px rgba(0,0,0,.14);
    --gutter: 16px;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --card: #201f1d; --ink: #eceae6; --muted: #9a978f;
      --line: #322f2c; --accent: #f0913f; --accent-bg: #3a2717; --on-accent: #1a1006;
      --down: #6cc98c; --down-bg: #1d3226;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
      --sheet-shadow: 0 -8px 32px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .panel:focus { outline: none; }
  svg { display: block; flex: none; }

  /* ---- En-tête ---- */
  header {
    padding: calc(14px + env(safe-area-inset-top)) max(var(--gutter), env(safe-area-inset-right))
             4px max(var(--gutter), env(safe-area-inset-left));
  }
  h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; line-height: 1.2; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* ---- Barre collante : recherche, filtres, raccourcis ---- */
  .bar {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    padding: 10px max(var(--gutter), env(safe-area-inset-right)) 0 max(var(--gutter), env(safe-area-inset-left));
    padding-top: max(10px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line);
  }
  .row { display: flex; gap: 8px; }
  .search {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: var(--muted);
  }
  .search input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; color: var(--ink);
    -webkit-appearance: none; appearance: none;
  }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search:focus-within { border-color: var(--accent); }
  .btn-filters {
    height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 7px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; font-weight: 560;
  }
  .badge {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 13px; font-weight: 700;
    display: inline-grid; place-items: center; background: var(--accent); color: var(--on-accent);
  }
  .badge[hidden] { display: none; }

  .chips {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 10px 0 12px;
    margin: 0 calc(-1 * var(--gutter)); padding-left: var(--gutter); padding-right: var(--gutter);
    scroll-padding-inline: var(--gutter); -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip { position: relative; flex: none; }
  .chip input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .chip span {
    display: flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 18px;
    border: 1px solid var(--line); background: var(--card); font-size: 15px; white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- Ligne compteur + tri ---- */
  .meta-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px max(var(--gutter), env(safe-area-inset-right)) 4px max(var(--gutter), env(safe-area-inset-left));
  }
  #count { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #count b { color: var(--ink); }
  .sort { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 15px; }
  .sort select {
    border: 0; background: none; font-size: 16px; font-weight: 560; color: var(--ink);
    padding: 8px 2px; max-width: 58vw; text-overflow: ellipsis;
  }

  /* ---- Panneau de filtres : feuille du bas sur mobile, colonne sur grand écran ---- */
  .scrim {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.38);
    opacity: 0; pointer-events: none; transition: opacity .3s var(--ease);
  }
  .panel {
    position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; max-height: 88dvh;
    display: flex; flex-direction: column; background: var(--card);
    border-radius: 18px 18px 0 0; box-shadow: var(--sheet-shadow);
    transform: translateY(105%); transition: transform .38s var(--ease); visibility: hidden;
  }
  body.sheet-open .scrim { opacity: 1; pointer-events: auto; }
  body.sheet-open .panel { transform: none; visibility: visible; }
  body.sheet-open { overflow: hidden; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 20px;
  }
  .panel-head h2 { margin: 0; font-size: 21px; letter-spacing: -.01em; }
  .icon-btn {
    width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none;
    border-radius: 22px; color: var(--muted);
  }
  .panel-body { overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 16px; }
  .group { padding: 14px 0; border-top: 1px solid var(--line); }
  .group:first-child { border-top: 0; }
  .group h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .field { display: block; margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .field-top span:first-child { font-size: 15px; }
  .val { font-weight: 650; font-variant-numeric: tabular-nums; }
  .val small { font-weight: 400; color: var(--muted); font-size: 13px; }
  input[type=range] { width: 100%; height: 32px; margin: 0; accent-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg label { flex: 1; position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg span {
    display: grid; place-items: center; height: 40px; font-size: 15px; border-left: 1px solid var(--line);
    font-variant-numeric: tabular-nums; transition: background .15s, color .15s;
  }
  .seg label:first-child span { border-left: 0; }
  .seg input:checked + span { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pair .field-top span:first-child { font-size: 15px; }
  .select {
    width: 100%; height: 44px; padding: 0 12px; font-size: 16px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg);
  }
  .toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 48px; font-size: 15px; cursor: pointer;
  }
  .toggle small { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; }
  .toggle input {
    -webkit-appearance: none; appearance: none; flex: none; width: 46px; height: 28px; margin: 0;
    border-radius: 14px; background: var(--line); position: relative; cursor: pointer; transition: background .2s;
  }
  .toggle input::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s var(--ease);
  }
  .toggle input:checked { background: var(--accent); }
  .toggle input:checked::after { transform: translateX(18px); }
  .panel-foot {
    display: flex; gap: 10px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  .btn {
    height: 48px; padding: 0 18px; border-radius: 12px; font-weight: 600; font-size: 16px;
    border: 1px solid var(--line); background: var(--card);
  }
  .btn.primary { flex: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  /* ---- Annonces ---- */
  main { padding: 8px max(var(--gutter), env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left)); }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 16px; } }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
    text-decoration: none; color: inherit; transition: transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  @media (hover: hover) { .card:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(0,0,0,.1); } }
  .card:active { transform: scale(.985); }
  .ph { aspect-ratio: 16/10; width: 100%; object-fit: cover; background: var(--line); display: block; }
  @media (min-width: 560px) { .ph { aspect-ratio: 4/3; } }
  .ph.none { display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .price { font-size: 21px; font-weight: 680; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .price small { font-weight: 450; color: var(--muted); font-size: 15px; letter-spacing: 0; }
  .name { font-weight: 580; font-size: 16px; line-height: 1.3; }
  .specs { color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
  .specs .dot { color: var(--muted); padding: 0 4px; }
  .place { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tags:empty { display: none; }
  .tag {
    font-size: 13px; padding: 3px 9px; border-radius: 20px; line-height: 1.4;
    border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .tag.drop { background: var(--down-bg); border-color: transparent; color: var(--down); font-weight: 600; }
  .tag.deal { border-color: var(--down); color: var(--down); font-weight: 600; }
  .tag.haut { background: var(--accent-bg); border-color: transparent; color: var(--accent); font-weight: 600; }
  .tag.bail { background: var(--accent); border-color: transparent; color: var(--on-accent); font-weight: 600; }
  .more {
    display: block; width: 100%; max-width: 360px; margin: 24px auto 0; height: 48px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; font-weight: 600;
  }
  .empty { text-align: center; padding: 48px 12px; color: var(--muted); }
  .empty p { margin: 0 0 16px; }

  /* ---- Grand écran : la feuille devient une colonne fixe ---- */
  @media (min-width: 960px) {
    :root { --gutter: 28px; }
    .layout { display: grid; grid-template-columns: 300px 1fr; gap: 28px; max-width: 1480px; margin: 0 auto; padding: 0 var(--gutter); }
    header, .bar, .meta-row, main { padding-left: 0; padding-right: 0; }
    header { max-width: 1480px; margin: 0 auto; padding: 24px var(--gutter) 8px; }
    .btn-filters, .scrim, .grab, .panel-head .icon-btn, .panel-foot .primary { display: none; }
    .panel {
      position: sticky; top: 16px; align-self: start; max-height: calc(100dvh - 32px);
      transform: none; visibility: visible; transition: none; border-radius: 14px;
      border: 1px solid var(--line); box-shadow: var(--shadow); margin-top: 16px;
    }
    .panel-head { padding: 14px 20px 0; }
    .panel-foot { padding: 12px 20px; }
    .panel-foot .btn { flex: 1; }
    .bar { position: static; border-bottom: 0; padding-top: 16px; }
    /* La colonne porte déjà ces filtres : les raccourcis n'y feraient que doublon. */
    .chips { display: none; }
    .pair { grid-template-columns: 1fr; }
    .meta-row { padding-top: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Locations à Bangkok</h1>
  <div class="sub" id="sub"></div>
</header>

<div class="layout">
  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" aria-labelledby="panelTitle" tabindex="-1">
    <div class="grab" aria-hidden="true"></div>
    <div class="panel-head">
      <h2 id="panelTitle">Filtres</h2>
      <button class="icon-btn" id="close" aria-label="Fermer les filtres">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <section class="group">
        <h3>Logement</h3>
        <label class="field">
          <span class="field-top"><span>Loyer max</span><span class="val" id="vBudget"></span></span>
          <input type="range" id="budget" min="200" max="3000" step="25">
        </label>
        <label class="field">
          <span class="field-top"><span>Surface min</span><span class="val" id="vArea"></span></span>
          <input type="range" id="area" min="0" max="200" step="5">
        </label>
        <div class="pair field">
          <div>
            <div class="field-top"><span>Chambres</span></div>
            <div class="seg" role="radiogroup" aria-label="Chambres minimum">
              <label><input type="radio" name="beds" value="0"><span>Tout</span></label>
              <label><input type="radio" name="beds" value="1"><span>1+</span></label>
              <label><input type="radio" name="beds" value="2"><span>2+</span></label>
              <label><input type="radio" name="beds" value="3"><span>3+</span></label>
            </div>
          </div>
          <div>
            <div class="field-top"><span>Salles de bain</span></div>
            <div class="seg" role="radiogroup" aria-label="Salles de bain minimum">
              <label><input type="radio" name="baths" value="0"><span>Tout</span></label>
              <label><input type="radio" name="baths" value="1"><span>1+</span></label>
              <label><input type="radio" name="baths" value="2"><span>2+</span></label>
            </div>
          </div>
        </div>
        <label class="field">
          <span class="field-top"><span>Quartier</span></span>
          <select class="select" id="district"></select>
        </label>
      </section>

      <section class="group">
        <h3>Immeuble</h3>
        <label class="toggle"><span>Haut de gamme<small>Plus cher au m² que son quartier : neuf, entretenu, équipé</small></span><input type="checkbox" data-f="haut"></label>
        <label class="toggle"><span>Récent<small id="recentHint"></small></span><input type="checkbox" data-f="recent"></label>
        <label class="toggle"><span>Piscine et salle de sport</span><input type="checkbox" data-f="poolGym"></label>
      </section>

      <section class="group">
        <h3>Annonce</h3>
        <label class="toggle"><span>Bail court<small>1 à 6 mois, renseigné par Renthub seulement</small></span><input type="checkbox" data-f="bailCourt"></label>
        <label class="toggle"><span>Prix en baisse</span><input type="checkbox" data-f="onlyDrop"></label>
        <label class="toggle"><span>Avec photo</span><input type="checkbox" data-f="withPhoto"></label>
      </section>
    </div>
    <div class="panel-foot">
      <button class="btn" id="reset">Réinitialiser</button>
      <button class="btn primary" id="apply"></button>
    </div>
  </aside>

  <div>
    <div class="bar">
      <div class="row">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="q" placeholder="Résidence ou quartier" enterkeyhint="search" autocomplete="off" aria-label="Rechercher une résidence ou un quartier">
        </label>
        <button class="btn-filters" id="open" aria-controls="panel" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          Filtres <span class="badge" id="nActive" hidden></span>
        </button>
      </div>
      <div class="chips" role="group" aria-label="Filtres rapides">
        <label class="chip"><input type="checkbox" data-f="haut"><span>Haut de gamme</span></label>
        <label class="chip"><input type="checkbox" data-f="recent"><span>Récent</span></label>
        <label class="chip"><input type="checkbox" data-f="poolGym"><span>Piscine + sport</span></label>
        <label class="chip"><input type="checkbox" data-f="onlyDrop"><span>Prix en baisse</span></label>
        <label class="chip"><input type="checkbox" data-f="bailCourt"><span>Bail court</span></label>
      </div>
    </div>

    <div class="meta-row">
      <div id="count" aria-live="polite"></div>
      <label class="sort">Trier
        <select id="sort">
          <option value="-standing">Standing de l'immeuble</option>
          <option value="affaire">Meilleure affaire</option>
          <option value="-year">Immeuble le plus récent</option>
          <option value="price">Prix croissant</option>
          <option value="-price">Prix décroissant</option>
          <option value="sqm">€/m² croissant</option>
          <option value="-area">Surface décroissante</option>
          <option value="-drop">Plus fortes baisses</option>
          <option value="-seen">Vues récemment</option>
        </select>
      </label>
    </div>

    <main>
      <div class="grid" id="grid"></div>
      <button class="more" id="more" hidden>Afficher plus</button>
      <div class="empty" id="empty" hidden>
        <p>Aucune annonce ne correspond à ces critères.</p>
        <button class="btn" id="emptyReset">Réinitialiser les filtres</button>
      </div>
    </main>
  </div>
</div>

<script>
const DATA = __DATA__;
const META = __META__;
const PAGE = 60;
let shown = PAGE;

const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat('fr-FR');
// Les noms et URL viennent des sites scrapés : jamais injectés tels quels dans le HTML.
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
// Écart entre le premier et le dernier relevé : négatif = le loyer a baissé.
const drop = l => l.prices ? l.prices.at(-1)[1] - l.prices[0][1] : 0;
const perSqm = l => (l.area_sqm && l.price_eur) ? l.price_eur / l.area_sqm : Infinity;
// Une entree decrivant un batiment entier plutot qu'un logement : aucun des trois
// criteres unitaires n'existe. C'est le cas de toute la source Renthub.
const immeuble = l => l.bedrooms == null && l.area_sqm == null;

// Médiane du €/m² par quartier, calculée une fois au chargement plutôt que servie dans
// les données : 3600 valeurs dérivables coûtent moins cher à recalculer qu'à transporter.
// Les quartiers trop peu fournis sont écartés — une médiane sur 4 annonces ne dit rien.
const MEDIANES = (() => {
  const par = {}, out = {};
  for (const l of DATA) {
    const v = perSqm(l);
    if (isFinite(v) && l.district) (par[l.district] ??= []).push(v);
  }
  for (const [d, vs] of Object.entries(par)) {
    if (vs.length < 10) continue;
    vs.sort((a, b) => a - b);
    out[d] = vs[Math.floor(vs.length / 2)];
  }
  return out;
})();

// 0,77 = 23 % moins cher au m² que la médiane de son quartier. Infinity = non comparable.
// Sous 0,5 ce n'est pas une affaire mais une erreur de saisie ou une maison de banlieue
// glissée dans la recherche condo : elle irait sinon squatter la tête du tri par défaut.
const affaire = l => {
  const m = MEDIANES[l.district], v = perSqm(l), r = v / m;
  return (m && isFinite(v) && r >= 0.5) ? r : Infinity;
};

// Standing d'un immeuble : son €/m² médian rapporté à celui de son quartier. Le marché paie
// le neuf, l'entretien et les équipements — 1,3 = immeuble 30 % plus cher au m² que le coin.
// Calculé sur toutes les annonces de l'immeuble, quelle que soit leur taille, et seulement
// à partir de 3 : en dessous c'est le prix d'un logement, pas celui d'un immeuble.
// ponytail: les petites surfaces sont plus chères au m², un immeuble de studios ressort donc
// un peu flatté. Corriger par surface si le classement s'en trouve faussé à l'usage.
const immKey = l => `${l.district}|${(l.name || '').trim().toLowerCase()}`;
const STANDING = (() => {
  const par = {}, out = {};
  for (const l of DATA) {
    const v = perSqm(l);
    if (isFinite(v) && l.name && l.district) (par[immKey(l)] ??= []).push(v);
  }
  for (const [k, vs] of Object.entries(par)) {
    const m = MEDIANES[k.split('|')[0]];
    if (vs.length < 3 || !m) continue;
    vs.sort((a, b) => a - b);
    out[k] = vs[Math.floor(vs.length / 2)] / m;
  }
  return out;
})();
const standing = l => STANDING[immKey(l)] ?? 0;
const HAUT = META.standing_min;
// Année d'achèvement minimale pour « récent ». Sans année connue, l'immeuble n'est pas récent.
const RECENT = new Date().getFullYear() - META.recent_max_age;

$('sub').textContent = `${nf.format(META.total)} annonces · mises à jour le ${META.last} · ${META.rate} ฿/€`;
$('recentHint').textContent = `Achevé en ${RECENT} ou après`;

const districts = [...new Set(DATA.map(l => l.district).filter(Boolean))].sort();
$('district').innerHTML = '<option value="">Tous les quartiers</option>'
  + districts.map(d => `<option>${esc(d)}</option>`).join('');

// ---- État des filtres ----
// Une seule source de vérité : les cases d'un même filtre (raccourci + panneau) sont
// synchronisées par leur data-f. L'état est gardé dans le navigateur pour retrouver ses
// critères en rouvrant la page sur le téléphone.
const DEFAULTS = {
  budget: META.budget_max_eur, area: META.area_min, beds: '2', baths: '2', district: '', sort: '-standing',
  haut: false, recent: false, poolGym: false, onlyDrop: false, bailCourt: false, withPhoto: true,
};
const FLAGS = ['haut', 'recent', 'poolGym', 'onlyDrop', 'bailCourt', 'withPhoto'];
const KEY = 'brw-filtres-v1';
let state = { ...DEFAULTS };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

function paint() {
  $('budget').value = state.budget; $('area').value = state.area;
  $('district').value = state.district; $('sort').value = state.sort;
  document.querySelector(`[name=beds][value="${state.beds}"]`).checked = true;
  document.querySelector(`[name=baths][value="${state.baths}"]`).checked = true;
  document.querySelectorAll('[data-f]').forEach(el => { el.checked = !!state[el.dataset.f]; });
}

function filtered() {
  const { budget, area, district: dist } = state;
  const beds = +state.beds, baths = +state.baths;
  const { withPhoto: photo, onlyDrop: dropOnly, bailCourt, haut, recent, poolGym } = state;
  const q = $('q').value.trim().toLowerCase();

  let out = DATA.filter(l =>
    (l.price_eur ?? 0) <= budget
    // Renthub décrit des immeubles, pas des logements : ni chambres, ni salles de bain,
    // ni surface à ce niveau — ils sont sur la fiche, par type de chambre. Une entrée
    // sans aucun des trois n'est filtrable sur aucun critère de logement, donc elle
    // n'apparaît que quand on demande le bail court, qu'elle seule renseigne.
    && (immeuble(l) ? bailCourt : (l.area_sqm ?? 0) >= area)
    && (immeuble(l) ? bailCourt : l.bedrooms >= beds)
    && (immeuble(l) ? bailCourt : (l.bathrooms ?? 0) >= baths)
    && (!bailCourt || l.min_lease_months)
    && (!dist || l.district === dist)
    && (!photo || l.photos)
    && (!dropOnly || drop(l) < 0)
    && (!haut || standing(l) >= HAUT)
    && (!recent || l.year >= RECENT)
    && (!poolGym || (l.pool && l.gym))
    && (!q || (l.name || '').toLowerCase().includes(q) || (l.district || '').toLowerCase().includes(q))
  );

  const by = {
    'affaire': (a, b) => affaire(a) - affaire(b),
    '-standing': (a, b) => standing(b) - standing(a),
    '-year':  (a, b) => (b.year ?? 0) - (a.year ?? 0),
    'price':  (a, b) => a.price_thb - b.price_thb,
    '-price': (a, b) => b.price_thb - a.price_thb,
    'sqm':    (a, b) => perSqm(a) - perSqm(b),
    '-area':  (a, b) => (b.area_sqm ?? 0) - (a.area_sqm ?? 0),
    '-drop':  (a, b) => drop(a) - drop(b),
    '-seen':  (a, b) => (b.last_seen ?? '').localeCompare(a.last_seen ?? ''),
  }[state.sort];
  return out.sort(by);
}

function card(l) {
  const d = drop(l);
  const sqm = perSqm(l);
  // Les faits du logement en une ligne de texte ; les pastilles sont réservées aux signaux.
  const specs = [
    l.area_sqm ? `${l.area_sqm} m²` : '',
    l.bedrooms ? `${l.bedrooms} ch` : '',
    l.bathrooms ? `${l.bathrooms} sdb` : '',
    l.floor ? `ét. ${l.floor}` : '',
    isFinite(sqm) ? `${Math.round(sqm)} €/m²` : '',
  ].filter(Boolean).join('<span class="dot">·</span>');
  const place = [
    l.district,
    l.station_distance_m ? `${l.station_distance_m} m de ${l.nearest_station}` : '',
    l.year ? `${l.year > new Date().getFullYear() ? 'livraison' : 'achevé'} ${l.year}` : '',
    l.pool && l.gym ? 'piscine, sport' : l.pool ? 'piscine' : l.gym ? 'salle de sport' : '',
    l.source,
  ].filter(Boolean).map(esc).join(' · ');

  const tags = [];
  if (d < 0) tags.push(`<span class="tag drop">↓ ${nf.format(-d)} ฿ depuis le ${esc(l.prices[0][0])}</span>`);
  // Le bail court est l'information la plus rare du projet : elle passe devant le reste.
  if (l.min_lease_months) tags.push(`<span class="tag bail">bail ${l.min_lease_months} mois</span>`);
  const s = standing(l);
  if (s >= HAUT) tags.push(`<span class="tag haut">haut de gamme · +${Math.round((s - 1) * 100)} %</span>`);
  // Écart à la médiane du quartier : sous −15 % c'est une affaire, au-dessus de +15 %
  // c'est cher pour le coin. Entre les deux il n'y a rien à signaler.
  const a = affaire(l);
  // Côté cher, la pastille haut de gamme dit déjà la même chose : on n'en garde qu'une.
  if (isFinite(a) && (a <= 0.85 || (a >= 1.15 && s < HAUT))) {
    const pct = Math.round((a - 1) * 100);
    tags.push(`<span class="tag${pct < 0 ? ' deal' : ''}">${pct > 0 ? '+' : '−'}${Math.abs(pct)} % vs quartier</span>`);
  }

  const img = l.photos
    ? `<img class="ph" src="${esc(l.photos)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;ph none&quot;>photo indisponible</div>'">`
    : `<div class="ph none">pas de photo</div>`;

  return `<a class="card" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
    ${img}
    <div class="body">
      <div class="price">${nf.format(l.price_eur)} € <small>· ${nf.format(l.price_thb)} ฿/mois</small></div>
      <div class="name">${esc(l.name ?? 'Sans nom')}</div>
      ${specs ? `<div class="specs">${specs}</div>` : ''}
      <div class="place">${place}</div>
      <div class="spacer"></div>
      <div class="tags">${tags.join('')}</div>
    </div></a>`;
}

// ---- Rendu ----
const isSheet = () => !matchMedia('(min-width: 960px)').matches;
const plural = (n, w) => `${nf.format(n)} ${w}${n > 1 ? 's' : ''}`;
let rows = [];

function update({ grid = true } = {}) {
  rows = filtered();
  $('count').innerHTML = `<b>${nf.format(rows.length)}</b> annonce${rows.length > 1 ? 's' : ''}`;
  $('apply').textContent = rows.length ? `Voir ${plural(rows.length, 'annonce')}` : 'Aucune annonce';
  $('vBudget').innerHTML = `${nf.format(state.budget)} € <small>${nf.format(Math.round(state.budget * META.rate))} ฿</small>`;
  $('vArea').textContent = `${state.area} m²`;
  const n = Object.keys(DEFAULTS).filter(k => k !== 'sort' && String(state[k]) !== String(DEFAULTS[k])).length;
  $('nActive').textContent = n; $('nActive').hidden = !n;
  if (grid) renderGrid();
}

function renderGrid() {
  $('grid').innerHTML = rows.slice(0, shown).map(card).join('');
  $('more').hidden = rows.length <= shown;
  $('more').textContent = `Afficher plus · ${plural(rows.length - shown, 'restante')}`;
  $('empty').hidden = rows.length > 0;
}

// Un seul rendu par image même quand le curseur envoie des dizaines d'événements.
let raf = 0;
function schedule() {
  cancelAnimationFrame(raf);
  // Feuille ouverte sur mobile : on ne met à jour que le compteur, la grille cachée derrière
  // est reconstruite à la fermeture. Reconstruire 60 cartes à chaque pixel de curseur saccade.
  raf = requestAnimationFrame(() => update({ grid: !document.body.classList.contains('sheet-open') }));
}

function onChange(e) {
  const el = e.target;
  if (el.dataset.f) {
    state[el.dataset.f] = el.checked;
    document.querySelectorAll(`[data-f="${el.dataset.f}"]`).forEach(x => { x.checked = el.checked; });
  } else if (el.name === 'beds' || el.name === 'baths') state[el.name] = el.value;
  else if (el.id === 'budget' || el.id === 'area') state[el.id] = +el.value;
  else if (el.id === 'district' || el.id === 'sort') state[el.id] = el.value;
  shown = PAGE; save(); schedule();
  if (el.id === 'sort' || el.closest('.chips')) scrollTo({ top: 0, behavior: 'smooth' });
}
document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', onChange));

// ---- Feuille de filtres (mobile) ----
let lastFocus = null;
function openSheet() {
  lastFocus = document.activeElement;
  document.body.classList.add('sheet-open');
  $('open').setAttribute('aria-expanded', 'true');
  $('panel').setAttribute('role', 'dialog'); $('panel').setAttribute('aria-modal', 'true');
  setTimeout(() => $('panel').focus({ preventScroll: true }), 50);
}
function closeSheet() {
  if (!document.body.classList.contains('sheet-open')) return;
  document.body.classList.remove('sheet-open');
  $('open').setAttribute('aria-expanded', 'false');
  $('panel').removeAttribute('role'); $('panel').removeAttribute('aria-modal');
  renderGrid();
  lastFocus?.focus();
}
$('open').addEventListener('click', openSheet);
$('close').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', closeSheet);
$('apply').addEventListener('click', () => { closeSheet(); scrollTo({ top: 0 }); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
matchMedia('(min-width: 960px)').addEventListener('change', closeSheet);

// Glisser la poignée vers le bas ferme la feuille, comme une feuille iOS.
let y0 = null;
$('panel').addEventListener('touchstart', e => {
  if (isSheet() && !e.target.closest('.panel-body, input, select, button')) y0 = e.touches[0].clientY;
}, { passive: true });
$('panel').addEventListener('touchmove', e => {
  if (y0 == null) return;
  const dy = Math.max(0, e.touches[0].clientY - y0);
  $('panel').style.transition = 'none'; $('panel').style.transform = `translateY(${dy}px)`;
}, { passive: true });
$('panel').addEventListener('touchend', e => {
  if (y0 == null) return;
  const dy = e.changedTouches[0].clientY - y0;
  y0 = null; $('panel').style.transition = ''; $('panel').style.transform = '';
  if (dy > 90) closeSheet();
});

function reset() {
  state = { ...DEFAULTS, sort: state.sort };
  $('q').value = '';
  save(); paint(); shown = PAGE; update({ grid: !document.body.classList.contains('sheet-open') });
}
$('reset').addEventListener('click', reset);
$('emptyReset').addEventListener('click', () => { reset(); scrollTo({ top: 0 }); });
$('more').addEventListener('click', () => { shown += PAGE; renderGrid(); });
// Valider la recherche referme le clavier iOS : sinon il masque la moitié des résultats.
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

paint();
update();
</script>
</body>
</html>
